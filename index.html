<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning Kanban</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --text: #1d2330;
    --muted: #6b7280;
    --border: #e2e5ea;
    --accent: #2563eb;
    --danger: #dc2626;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218;
      --panel: #1a1f29;
      --text: #e6e9ef;
      --muted: #9aa3b2;
      --border: #2c3442;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1218;
    --panel: #1a1f29;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --border: #2c3442;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 2;
  }
  header h1 { font-size: 20px; margin: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .who { font-size: 13px; color: var(--muted); }

  button {
    font: inherit;
    font-size: 14px;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  button.small { font-size: 12px; padding: 3px 8px; }

  .signin {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 80px 20px;
    text-align: center;
  }
  .signin p { color: var(--muted); margin: 0; max-width: 420px; }
  .signin button { font-size: 16px; padding: 10px 18px; }

  .status {
    margin: 12px 20px 0;
    padding: 10px 14px;
    border-radius: 8px;
    background: color-mix(in srgb, var(--danger) 12%, var(--panel));
    border: 1px solid var(--danger);
    font-size: 14px;
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 12px 20px;
  }
  .filters .title { color: var(--muted); font-size: 13px; margin-right: 4px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 2px solid transparent;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    opacity: 0.55;
    user-select: none;
  }
  .chip.active { opacity: 1; border-color: var(--text); }
  .chip.clear { background: transparent; color: var(--text); border-color: var(--border); opacity: 1; }

  .board {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(260px, 1fr);
    gap: 14px;
    padding: 0 20px 40px;
    overflow-x: auto;
    align-items: start;
  }
  .column {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-height: 200px;
    transition: background 0.15s;
  }
  .column.over { background: color-mix(in srgb, var(--accent) 12%, var(--bg)); }
  .column[draggable="true"] { opacity: 0.6; }
  .column-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 10px 6px 14px;
  }
  .col-handle { cursor: grab; color: var(--muted); padding: 0 2px; user-select: none; letter-spacing: -2px; }
  .column-head input[type="text"] {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 4px 6px;
  }
  .column-head input[type="text"]:hover,
  .column-head input[type="text"]:focus { border-color: var(--border); background: var(--panel); outline: none; }
  .count { color: var(--muted); font-size: 12px; }
  .drop { padding: 4px 10px 10px; min-height: 120px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 10px;
    cursor: grab;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  }
  .card:active { cursor: grabbing; }
  .card h3 { font-size: 15px; margin: 6px 0; }
  .card .body { font-size: 13px; color: var(--muted); white-space: pre-wrap; margin: 6px 0; }
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    color: #fff;
    margin-right: 4px;
  }
  .tasks { list-style: none; padding: 0; margin: 8px 0; }
  .tasks li { margin: 4px 0; font-size: 13px; }
  .tasks label { display: flex; gap: 6px; align-items: flex-start; cursor: pointer; }
  .tasks .done { text-decoration: line-through; color: var(--muted); }
  .progress { font-size: 12px; color: var(--muted); }
  .card-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
    justify-content: flex-end;
    align-items: center;
  }
  .card-actions select { width: auto; margin-top: 0; padding: 3px 6px; font-size: 12px; }
  .add-column {
    border-style: dashed;
    color: var(--muted);
    min-height: 60px;
    align-self: stretch;
  }

  dialog {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--panel);
    color: var(--text);
    width: min(560px, 94vw);
    padding: 20px;
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
  dialog h2 { margin: 0 0 12px; font-size: 18px; }
  dialog label.field { display: block; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
  input[type="text"], select, textarea {
    width: 100%;
    font: inherit;
    font-size: 14px;
    padding: 8px;
    margin-top: 4px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
  }
  textarea { min-height: 80px; resize: vertical; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .checks label {
    display: inline-flex;
    gap: 6px;
    align-items: center;
    font-size: 13px;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .new-label-inline { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .new-label-inline input[type="text"] { margin-top: 0; flex: 1; }
  .new-label-inline input[type="color"] { width: 40px; height: 34px; border: none; background: none; padding: 0; }
  .task-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .task-row input[type="text"] { margin-top: 0; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .label-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .label-row input[type="text"] { margin-top: 0; flex: 1; }
  .label-row input[type="color"] { width: 40px; height: 34px; border: none; background: none; padding: 0; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 12px; }

  @media (max-width: 640px) {
    .board { grid-auto-columns: 80vw; }
  }
</style>
</head>
<body>

<header>
  <h1>Planning Kanban</h1>
  <div class="actions" id="header-actions" hidden>
    <span class="who" id="who"></span>
    <button id="btn-labels">Manage labels</button>
    <button id="btn-signout">Sign out</button>
    <button class="primary" id="btn-new">+ New issue</button>
  </div>
</header>

<div class="status" id="status" hidden></div>

<section class="signin" id="signin" hidden>
  <h2>Sign in to see the board</h2>
  <p>Only approved GitHub accounts can view or change the planning board.</p>
  <button class="primary" id="btn-signin">Sign in with GitHub</button>
</section>

<section id="app" hidden>
  <div class="filters" id="filters"></div>
  <main class="board" id="board"></main>
</section>

<!-- Issue dialog -->
<dialog id="issue-dialog">
  <form id="issue-form" method="dialog">
    <h2 id="issue-dialog-title">New issue</h2>

    <label class="field">Title
      <input type="text" id="f-title" required>
    </label>

    <label class="field">Column
      <select id="f-status"></select>
    </label>

    <div class="field">
      <span>Labels (projects)</span>
      <div class="checks" id="f-labels"></div>
      <div class="new-label-inline">
        <input type="text" id="f-new-label" placeholder="New label name">
        <input type="color" id="f-new-label-color" value="#7c3aed" title="Label color">
        <button type="button" class="small" id="btn-add-label-inline">Add label</button>
      </div>
    </div>

    <label class="field">Description
      <textarea id="f-body"></textarea>
    </label>

    <div class="field">
      <span>Checklist</span>
      <div id="f-tasks" style="margin-top:6px"></div>
      <button type="button" class="small" id="btn-add-task" style="margin-top:6px">+ Add item</button>
    </div>

    <div class="dialog-actions">
      <button type="button" id="btn-cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<!-- Labels dialog -->
<dialog id="labels-dialog">
  <h2>Labels / projects</h2>
  <div id="labels-list"></div>
  <form id="label-form" style="margin-top:14px; display:flex; gap:8px; align-items:center;">
    <input type="text" id="new-label-name" placeholder="New label, e.g. Marketing" required>
    <input type="color" id="new-label-color" value="#7c3aed" style="width:40px;height:34px;border:none;background:none;padding:0">
    <button type="submit">Add</button>
  </form>
  <div class="dialog-actions">
    <button type="button" id="btn-labels-close">Close</button>
  </div>
</dialog>

<script>
(() => {
  // Neon Auth (sign-in) and Neon Data API (storage) for the tektek project.
  // Same-site path, forwarded to Neon Auth by the planning-proxy Worker.
  const AUTH = "/auth";
  const API = "https://ep-silent-shadow-b9rx4q0d.apirest.c-7.eu-central-1.aws.neon.tech/neondb/rest/v1";
  const DEFAULT_COLUMNS = ["Backlog", "In progress", "In review", "Ready"];

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));

  // Board data, loaded from the database.
  let state = { columns: [], labels: [], issues: [] };
  let token = null;
  const filter = new Set(); // label ids; empty = show all
  let editingId = null;
  let draftTasks = [];
  let dragKind = null; // "issue" | "column"
  let dragId = null;
  let dragColumnId = null;

  const labelById = (id) => state.labels.find((l) => l.id === id);
  const issueById = (id) => state.issues.find((i) => i.id === id);
  const columnById = (id) => state.columns.find((c) => c.id === id);

  // ---------- messages ----------
  let statusTimer = null;
  function showError(message) {
    const box = document.getElementById("status");
    box.textContent = message;
    box.hidden = false;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { box.hidden = true; }, 8000);
  }

  // ---------- sign-in (GitHub, through the planning.tektek.fi Worker) ----------
  // The Worker keeps the session in a cookie on this domain and returns a short-lived token.
  async function fetchToken() {
    const r = await fetch("/auth/token", { credentials: "same-origin", cache: "no-store" });
    if (!r.ok) return null;
    return r.json(); // { token, login }
  }

  function signIn() {
    location.href = "/auth/login";
  }

  function signOut() {
    location.href = "/auth/logout";
  }

  function showSignedOut() {
    document.getElementById("header-actions").hidden = true;
    document.getElementById("app").hidden = true;
    document.getElementById("signin").hidden = false;
  }

  function showSignedIn(login) {
    document.getElementById("who").textContent = login || "";
    document.getElementById("header-actions").hidden = false;
    document.getElementById("signin").hidden = true;
    document.getElementById("app").hidden = false;
  }

  // ---------- database calls (Neon Data API) ----------
  async function api(path, { method = "GET", body, prefer } = {}) {
    const headers = { Authorization: "Bearer " + token };
    if (body !== undefined) headers["Content-Type"] = "application/json";
    if (prefer) headers.Prefer = prefer;
    const r = await fetch(API + path, {
      method,
      headers,
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
    if (!r.ok) throw new Error(await r.text() || `Request failed (${r.status})`);
    const text = await r.text();
    return text ? JSON.parse(text) : null;
  }

  async function loadBoard() {
    const [columns, labels, issues, links, tasks] = await Promise.all([
      api("/kanban_columns?select=*&order=position.asc"),
      api("/kanban_labels?select=*&order=created_at.asc"),
      api("/kanban_issues?select=*&order=created_at.asc"),
      api("/kanban_issue_labels?select=*"),
      api("/kanban_tasks?select=*&order=position.asc"),
    ]);
    state = {
      columns: columns.map((c) => ({ id: c.id, name: c.name, position: c.position })),
      labels: labels.map((l) => ({ id: l.id, name: l.name, color: l.color })),
      issues: issues.map((i) => ({
        id: i.id,
        title: i.title,
        body: i.body,
        columnId: i.column_id,
        labels: links.filter((x) => x.issue_id === i.id).map((x) => x.label_id),
        tasks: tasks
          .filter((t) => t.issue_id === i.id)
          .map((t) => ({ id: t.id, text: t.text, done: t.done })),
      })),
    };
    render();
  }

  // Runs a database change, then reloads the board so the screen matches the database.
  async function run(action) {
    try {
      await action();
      await loadBoard();
    } catch (err) {
      showError("Could not save: " + err.message);
      await loadBoard().catch(() => {});
    }
  }

  // ---------- render ----------
  function renderFilters() {
    const chips = state.labels.map((l) => `
      <span class="chip ${filter.has(l.id) ? "active" : ""}" data-filter="${l.id}"
            style="background:${esc(l.color)}">${esc(l.name)}</span>`).join("");
    document.getElementById("filters").innerHTML =
      `<span class="title">Filter by project:</span>${chips}` +
      (filter.size ? `<span class="chip clear" data-filter="__clear">Clear</span>` : "");
  }

  function cardHTML(i) {
    const tags = i.labels.map((id) => {
      const l = labelById(id);
      return l ? `<span class="tag" style="background:${esc(l.color)}">${esc(l.name)}</span>` : "";
    }).join("");
    const total = i.tasks.length;
    const done = i.tasks.filter((t) => t.done).length;
    const tasks = total ? `
      <ul class="tasks">
        ${i.tasks.map((t) => `
          <li><label>
            <input type="checkbox" data-task="${t.id}" ${t.done ? "checked" : ""}>
            <span class="${t.done ? "done" : ""}">${esc(t.text)}</span>
          </label></li>`).join("")}
      </ul>
      <div class="progress">${done}/${total} done</div>` : "";
    const moveOptions = state.columns.map((c) =>
      `<option value="${c.id}" ${c.id === i.columnId ? "selected" : ""}>${esc(c.name)}</option>`).join("");
    return `
      <article class="card" draggable="true" data-id="${i.id}">
        <div>${tags}</div>
        <h3>${esc(i.title)}</h3>
        ${i.body ? `<p class="body">${esc(i.body)}</p>` : ""}
        ${tasks}
        <div class="card-actions">
          <select data-move="${i.id}" aria-label="Move to column">${moveOptions}</select>
          <button class="small" data-action="edit" data-id="${i.id}">Edit</button>
          <button class="small danger" data-action="delete" data-id="${i.id}">Delete</button>
        </div>
      </article>`;
  }

  function renderBoard() {
    const visible = state.issues.filter((i) =>
      filter.size === 0 || i.labels.some((id) => filter.has(id)));
    const columns = state.columns.map((col) => {
      const items = visible.filter((i) => i.columnId === col.id);
      return `
        <section class="column" data-column="${col.id}">
          <div class="column-head">
            <span class="col-handle" title="Drag to move column">⋮⋮</span>
            <input type="text" data-col="${col.id}" value="${esc(col.name)}" aria-label="Column name">
            <span class="count">${items.length}</span>
            <button class="small danger" data-action="del-col" data-col="${col.id}" title="Delete column">✕</button>
          </div>
          <div class="drop">${items.map(cardHTML).join("")}</div>
        </section>`;
    }).join("");
    document.getElementById("board").innerHTML =
      columns + `<button class="add-column" data-action="add-col">+ Add column</button>`;
  }

  function render() {
    renderFilters();
    renderBoard();
  }

  // ---------- columns ----------
  function addColumn() {
    const name = prompt("Column name?");
    if (!name || !name.trim()) return;
    run(() => api("/kanban_columns", {
      method: "POST",
      body: { name: name.trim(), position: state.columns.length },
      prefer: "return=minimal",
    }));
  }

  function deleteColumn(id) {
    const col = columnById(id);
    if (!col) return;
    if (state.columns.length <= 1) {
      alert("Keep at least one column.");
      return;
    }
    const others = state.columns.filter((c) => c.id !== id);
    const moving = state.issues.filter((i) => i.columnId === id);
    const msg = moving.length
      ? `Delete "${col.name}"? Its ${moving.length} issue(s) will move to "${others[0].name}".`
      : `Delete "${col.name}"?`;
    if (!confirm(msg)) return;
    run(async () => {
      if (moving.length) {
        await api(`/kanban_issues?column_id=eq.${id}`, { method: "PATCH", body: { column_id: others[0].id } });
      }
      await api(`/kanban_columns?id=eq.${id}`, { method: "DELETE" });
    });
  }

  function renameColumn(id, name) {
    const clean = name.trim();
    if (!clean) return render();
    run(() => api(`/kanban_columns?id=eq.${id}`, { method: "PATCH", body: { name: clean } }));
  }

  // Move a column to just before or after another column, then save the new positions.
  function moveColumn(fromId, toId, after) {
    if (fromId === toId) return;
    const moved = columnById(fromId);
    const order = state.columns.filter((c) => c.id !== fromId);
    const idx = order.findIndex((c) => c.id === toId);
    order.splice(idx + (after ? 1 : 0), 0, moved);
    run(() => Promise.all(order.map((c, i) =>
      c.position === i ? null : api(`/kanban_columns?id=eq.${c.id}`, { method: "PATCH", body: { position: i } })
    )));
  }

  // ---------- board interactions ----------
  const board = document.getElementById("board");

  board.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === "add-col") return addColumn();
    if (action === "del-col") return deleteColumn(btn.dataset.col);

    const issue = issueById(btn.dataset.id);
    if (!issue) return;
    if (action === "edit") openIssue(issue.id);
    if (action === "delete" && confirm(`Delete "${issue.title}"?`)) {
      run(() => api(`/kanban_issues?id=eq.${issue.id}`, { method: "DELETE" }));
    }
  });

  board.addEventListener("change", (e) => {
    const target = e.target;

    if (target.matches("input[data-col]")) {
      renameColumn(target.dataset.col, target.value);
      return;
    }

    if (target.matches("select[data-move]")) {
      run(() => api(`/kanban_issues?id=eq.${target.dataset.move}`, {
        method: "PATCH",
        body: { column_id: target.value },
      }));
      return;
    }

    if (target.matches("input[data-task]")) {
      run(() => api(`/kanban_tasks?id=eq.${target.dataset.task}`, {
        method: "PATCH",
        body: { done: target.checked },
      }));
    }
  });

  board.addEventListener("dblclick", (e) => {
    const card = e.target.closest(".card");
    if (card && !e.target.closest("button, input, label, select")) openIssue(card.dataset.id);
  });

  // Drag issues between columns, or drag a column by its ⋮⋮ handle to reorder.
  // A column is only draggable while its handle is held, so text in its name stays selectable.
  board.addEventListener("mousedown", (e) => {
    const handle = e.target.closest(".col-handle");
    if (handle) handle.closest(".column").draggable = true;
  });
  document.addEventListener("mouseup", () => {
    document.querySelectorAll(".column[draggable='true']").forEach((c) => { c.draggable = false; });
  });

  board.addEventListener("dragstart", (e) => {
    if (e.target.matches(".column")) {
      dragKind = "column";
      dragColumnId = e.target.dataset.column;
      e.dataTransfer.setData("text/plain", dragColumnId);
      e.dataTransfer.effectAllowed = "move";
      return;
    }
    const card = e.target.closest(".card");
    if (!card) return;
    dragKind = "issue";
    dragId = card.dataset.id;
    e.dataTransfer.setData("text/plain", dragId);
    e.dataTransfer.effectAllowed = "move";
  });
  board.addEventListener("dragover", (e) => {
    const column = e.target.closest(".column");
    if (!column || !dragKind) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    document.querySelectorAll(".column.over").forEach((c) => {
      if (c !== column) c.classList.remove("over");
    });
    column.classList.add("over");
  });
  board.addEventListener("dragleave", (e) => {
    const column = e.target.closest(".column");
    if (column && !column.contains(e.relatedTarget)) column.classList.remove("over");
  });
  board.addEventListener("drop", (e) => {
    const column = e.target.closest(".column");
    if (!column || !dragKind) return;
    e.preventDefault();
    if (dragKind === "issue") {
      const issueId = dragId;
      const columnId = column.dataset.column;
      run(() => api(`/kanban_issues?id=eq.${issueId}`, { method: "PATCH", body: { column_id: columnId } }));
    } else {
      const rect = column.getBoundingClientRect();
      moveColumn(dragColumnId, column.dataset.column, e.clientX > rect.left + rect.width / 2);
    }
    dragKind = null; dragId = null; dragColumnId = null;
  });
  board.addEventListener("dragend", () => {
    dragKind = null; dragId = null; dragColumnId = null;
    document.querySelectorAll(".column.over").forEach((c) => c.classList.remove("over"));
  });

  // label filter chips
  document.getElementById("filters").addEventListener("click", (e) => {
    const chip = e.target.closest("[data-filter]");
    if (!chip) return;
    if (chip.dataset.filter === "__clear") filter.clear();
    else if (filter.has(chip.dataset.filter)) filter.delete(chip.dataset.filter);
    else filter.add(chip.dataset.filter);
    render();
  });

  // ---------- issue dialog ----------
  const issueDialog = document.getElementById("issue-dialog");
  const fTitle = document.getElementById("f-title");
  const fStatus = document.getElementById("f-status");
  const fLabels = document.getElementById("f-labels");
  const fBody = document.getElementById("f-body");
  const fTasks = document.getElementById("f-tasks");

  function renderTaskEditor() {
    fTasks.innerHTML = draftTasks.map((t, idx) => `
      <div class="task-row">
        <input type="checkbox" data-idx="${idx}" data-field="done" ${t.done ? "checked" : ""} title="Done">
        <input type="text" data-idx="${idx}" data-field="text" value="${esc(t.text)}" placeholder="Checklist item">
        <button type="button" class="small danger" data-remove="${idx}">✕</button>
      </div>`).join("");
  }

  fTasks.addEventListener("input", (e) => {
    const idx = Number(e.target.dataset.idx);
    if (e.target.dataset.field === "text") draftTasks[idx].text = e.target.value;
  });
  fTasks.addEventListener("change", (e) => {
    const idx = Number(e.target.dataset.idx);
    if (e.target.dataset.field === "done") draftTasks[idx].done = e.target.checked;
  });
  fTasks.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-remove]");
    if (!btn) return;
    draftTasks.splice(Number(btn.dataset.remove), 1);
    renderTaskEditor();
  });
  document.getElementById("btn-add-task").addEventListener("click", () => {
    draftTasks.push({ id: null, text: "", done: false });
    renderTaskEditor();
    fTasks.querySelector(".task-row:last-child input[type=text]").focus();
  });

  function renderLabelChecks(selected) {
    fLabels.innerHTML = state.labels.map((l) => `
      <label>
        <input type="checkbox" value="${l.id}" ${selected.includes(l.id) ? "checked" : ""}>
        <span class="tag" style="background:${esc(l.color)}; margin:0">${esc(l.name)}</span>
      </label>`).join("") || `<span class="hint">No labels yet. Add some below.</span>`;
  }

  // Create a label without leaving the issue dialog, and tick it for this issue.
  const fNewLabel = document.getElementById("f-new-label");
  async function addInlineLabel() {
    const name = fNewLabel.value.trim();
    if (!name) return;
    const selected = [...fLabels.querySelectorAll("input:checked")].map((b) => b.value);
    const color = document.getElementById("f-new-label-color").value;
    try {
      const [row] = await api("/kanban_labels", {
        method: "POST",
        body: { name, color },
        prefer: "return=representation",
      });
      fNewLabel.value = "";
      state.labels.push({ id: row.id, name: row.name, color: row.color });
      renderLabelChecks([...selected, row.id]);
      renderFilters();
    } catch (err) {
      showError("Could not add label: " + err.message);
    }
  }
  document.getElementById("btn-add-label-inline").addEventListener("click", addInlineLabel);
  fNewLabel.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); addInlineLabel(); } // don't submit the issue form
  });

  function openIssue(id, presetColumn) {
    const issue = id ? issueById(id) : null;
    editingId = issue ? issue.id : null;
    document.getElementById("issue-dialog-title").textContent = issue ? "Edit issue" : "New issue";
    fTitle.value = issue ? issue.title : "";
    fStatus.innerHTML = state.columns.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
    fStatus.value = issue ? issue.columnId : (presetColumn || state.columns[0].id);
    fBody.value = issue ? issue.body : "";
    draftTasks = issue ? issue.tasks.map((t) => ({ ...t })) : [];
    renderLabelChecks(issue ? issue.labels : []);
    renderTaskEditor();
    issueDialog.showModal();
    fTitle.focus();
  }

  async function saveIssue(issueId, data) {
    let id = issueId;
    if (id) {
      await api(`/kanban_issues?id=eq.${id}`, {
        method: "PATCH",
        body: { title: data.title, body: data.body, column_id: data.columnId, updated_at: new Date().toISOString() },
      });
    } else {
      const [row] = await api("/kanban_issues", {
        method: "POST",
        body: { title: data.title, body: data.body, column_id: data.columnId },
        prefer: "return=representation",
      });
      id = row.id;
    }

    // Replace the label links and checklist items with the current form contents.
    await api(`/kanban_issue_labels?issue_id=eq.${id}`, { method: "DELETE" });
    if (data.labels.length) {
      await api("/kanban_issue_labels", {
        method: "POST",
        body: data.labels.map((label_id) => ({ issue_id: id, label_id })),
        prefer: "return=minimal",
      });
    }
    await api(`/kanban_tasks?issue_id=eq.${id}`, { method: "DELETE" });
    if (data.tasks.length) {
      await api("/kanban_tasks", {
        method: "POST",
        body: data.tasks.map((t, i) => ({ issue_id: id, text: t.text, done: t.done, position: i })),
        prefer: "return=minimal",
      });
    }
  }

  document.getElementById("btn-new").addEventListener("click", () => openIssue(null));
  document.getElementById("btn-cancel").addEventListener("click", () => issueDialog.close());

  document.getElementById("issue-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const title = fTitle.value.trim();
    if (!title) return;
    const data = {
      title,
      columnId: fStatus.value,
      body: fBody.value.trim(),
      labels: [...fLabels.querySelectorAll("input:checked")].map((b) => b.value),
      tasks: draftTasks
        .filter((t) => t.text.trim())
        .map((t) => ({ text: t.text.trim(), done: !!t.done })),
    };
    const issueId = editingId;
    issueDialog.close();
    run(() => saveIssue(issueId, data));
  });

  // ---------- labels dialog ----------
  const labelsDialog = document.getElementById("labels-dialog");
  const labelsList = document.getElementById("labels-list");

  function renderLabelsList() {
    labelsList.innerHTML = state.labels.map((l) => `
      <div class="label-row" data-id="${l.id}">
        <input type="color" value="${esc(l.color)}" data-field="color">
        <input type="text" value="${esc(l.name)}" data-field="name">
        <button type="button" class="small danger" data-delete="${l.id}">Delete</button>
      </div>`).join("") || `<p class="hint">No labels yet.</p>`;
  }

  // Saved when the field loses focus or the color is picked, not on every keystroke.
  labelsList.addEventListener("change", (e) => {
    const row = e.target.closest(".label-row");
    const field = e.target.dataset.field;
    if (!row || !field) return;
    const value = e.target.value.trim();
    if (field === "name" && !value) return renderLabelsList();
    run(() => api(`/kanban_labels?id=eq.${row.dataset.id}`, { method: "PATCH", body: { [field]: value } }));
  });

  labelsList.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-delete]");
    if (!btn) return;
    const label = labelById(btn.dataset.delete);
    if (!label || !confirm(`Delete label "${label.name}"? It will be removed from all issues.`)) return;
    filter.delete(label.id);
    run(() => api(`/kanban_labels?id=eq.${label.id}`, { method: "DELETE" }));
  });

  document.getElementById("label-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("new-label-name").value.trim();
    if (!name) return;
    const color = document.getElementById("new-label-color").value;
    document.getElementById("new-label-name").value = "";
    run(() => api("/kanban_labels", { method: "POST", body: { name, color }, prefer: "return=minimal" }));
  });

  document.getElementById("btn-labels").addEventListener("click", () => {
    renderLabelsList();
    labelsDialog.showModal();
  });
  document.getElementById("btn-labels-close").addEventListener("click", () => labelsDialog.close());

  // ---------- sign-in buttons ----------
  document.getElementById("btn-signin").addEventListener("click", signIn);
  document.getElementById("btn-signout").addEventListener("click", signOut);

  // ---------- start ----------
  async function start() {
    try {
      const session = await fetchToken();
      if (!session) return showSignedOut();

      token = session.token;
      showSignedIn(session.login);
      setInterval(async () => {
        const fresh = await fetchToken();
        if (fresh) token = fresh.token;
      }, 10 * 60 * 1000);

      // First use: create the default columns in an empty database.
      const existing = await api("/kanban_columns?select=id");
      if (existing.length === 0) {
        await api("/kanban_columns", {
          method: "POST",
          body: DEFAULT_COLUMNS.map((name, position) => ({ name, position })),
          prefer: "return=minimal",
        });
      }
      await loadBoard();
    } catch (err) {
      showError("Something went wrong: " + err.message);
      showSignedOut();
    }
  }

  start();
})();
</script>
</body>
</html>
